name: Refresh news and deploy independent application
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: independent-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/update-news.mjs
      - run: node scripts/update-market-calendar.mjs
      - run: node scripts/import-legacy-reports.mjs
      - run: node scripts/generate-daily-report.mjs
      - run: node scripts/update-market-from-report.mjs
      - run: node scripts/generate-period-reports.mjs
      - name: Persist reviewed market and report archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json daily-reports period-reports daily-report.json report-sources 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No reviewed market/report changes to persist."
          else
            git commit -m "chore(data): persist reviewed market and reports [skip ci]"
            git push
          fi
      - uses: actions/cache/restore@v4
        with:
          path: ai-budget.json
          key: ai-call-budget-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-call-budget-${{ github.repository_id }}-
      - name: Generate public evidence analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: gemini-3.7-flash
        run: node scripts/update-ai.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ai-budget.json
          key: ai-call-budget-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
