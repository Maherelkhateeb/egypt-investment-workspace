name: Refresh news and deploy independent application
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: independent-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/update-news.mjs
      - run: node scripts/import-legacy-reports.mjs
      - uses: actions/cache/restore@v4
        with:
          path: ai-budget.json
          key: ai-call-budget-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-call-budget-${{ github.repository_id }}-
      - name: Generate public evidence analysis with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/update-ai.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ai-budget.json
          key: ai-call-budget-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
