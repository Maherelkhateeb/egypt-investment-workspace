<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c14"><title>منظومة الأسهم الشرعية | المحفظة والأبحاث</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=1.1.2"><link rel="stylesheet" href="portal-match.css?v=1.2.0"><link rel="stylesheet" href="daily-report-match.css?v=1.2.0"><script src="core.js?v=1.1.2" defer></script><script src="providers.js?v=1.1.2" defer></script><script src="app.js?v=1.1.2" defer></script><script src="design.js?v=1.1.2" defer></script><script src="daily-report-view.js?v=1.2.0" defer></script><script src="ai-view.js?v=1.1.2" defer></script></head>
<body><header class="app-header"><div class="header-inner"><div class="sync-actions"><button id="headerSync" class="sync-button" title="إعادة تحميل ملف السوق والأخبار؛ لا يضيف بث أسعار لحظي">🔄 مزامنة</button><span class="sync-label"><i class="status-dot"></i><span id="sourceSession">أسعار مؤرخة</span></span></div><div class="brand"><span class="logo" aria-hidden="true">⚡</span><div><strong>الأسهم الشرعية <span lang="en">EGX</span></strong><small>محفظتك وأبحاثك · نسخة مستقلة</small></div></div><div class="header-actions"><button id="backup" class="backup-button" title="تنزيل نسخة احتياطية">نسخة احتياطية</button><button id="import" class="import-button" title="استيراد محفظة">استيراد</button><button id="themeToggle" class="theme-toggle" title="تبديل الوضع الليلي والنهاري" aria-label="تبديل الوضع الليلي والنهاري"><span id="themeIcon">🌙</span> <span id="themeLabel" class="theme-label">ليلي</span></button></div></div><div class="ticker-shell" aria-label="الأسعار المرجعية المؤرخة؛ ليست بثاً لحظياً"><div id="marketTicker" class="ticker-track"><span class="ticker-item">جار تحميل أسعار المصدر…</span></div></div></header>
<div id="notice" class="notice" role="status">جار تحميل البيانات…</div>
<nav class="bottom-dock" aria-label="أقسام التطبيق"><button data-route="portfolio"><span class="nav-icon" aria-hidden="true">💼</span><span>محفظتي</span></button><button data-route="performance" hidden>الأداء والمردود</button><button data-route="radar"><span class="nav-icon" aria-hidden="true">⚡</span><span>نبض السوق</span></button><button data-route="news"><span class="nav-icon" aria-hidden="true">📰</span><span>الأخبار</span></button><button data-route="research"><span class="nav-icon" aria-hidden="true">🎯</span><span>أبحاث الأسهم</span></button><button data-route="dailyreport"><span class="nav-icon" aria-hidden="true">📋</span><span>التقارير اليومية</span></button><button data-route="tools"><span class="nav-icon" aria-hidden="true">🛠️</span><span>أدواتي</span></button></nav>
<main id="view" tabindex="-1"></main><div id="toast" role="alert" hidden></div>
<dialog id="entryDialog"><form id="entryForm"><div class="title-row"><h2>تسجيل عملية</h2><button type="button" id="closeEntry" aria-label="إغلاق">×</button></div><p class="muted">تسجيل محلي للمحفظة؛ لا ينفذ صفقة لدى الوسيط.</p><div class="form-grid"><label>نوع العملية<select name="type"><option value="opening">رصيد افتتاحي</option><option value="buy">شراء</option><option value="sell">بيع</option><option value="deposit">إيداع نقدي</option><option value="withdraw">سحب نقدي</option><option value="dividend">توزيع نقدي</option><option value="fee">رسوم مستقلة</option></select></label><label>التاريخ<input name="date" type="date" required></label><label>رمز الأصل<input name="ticker" list="symbols" placeholder="TMGH"></label><label>نوع الأصل<select name="assetType"><option value="stock">سهم</option><option value="fund">صندوق</option><option value="gold">ذهب</option></select></label><label>الكمية<input name="qty" type="number" step="any" min="0"></label><label>سعر الوحدة<input name="price" type="number" step="any" min="0"></label><label>المبلغ (للعمليات النقدية)<input name="amount" type="number" step="any" min="0"></label><label>الرسوم المدفوعة (ج.م)<input name="fee" type="number" step="any" min="0" placeholder="فارغ = غير معلومة"></label><label class="span2">مرجع العملية أو كشف الوسيط<input name="source" maxlength="400" placeholder="رقم العملية أو تاريخ الكشف"></label></div><p id="entryError" class="bad" role="alert"></p><button class="primary" type="submit">حفظ العملية</button></form></dialog>
<input id="fileInput" type="file" accept=".json,application/json" hidden><datalist id="symbols"></datalist><footer>تُحفظ المحفظة في هذا المتصفح. احتفظ بنسخة احتياطية لنقلها إلى جهاز آخر. الأرقام الناقصة تظهر صراحة.</footer></body></html>
